<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Glow & Gradients -->
    <radialGradient id="sparkleGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFDD00" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FF5500" stop-opacity="0"/>
    </radialGradient>
    
    <!-- Gamepad Body Gradient (Vibrant Candy Purple to Electric Magenta) -->
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#A855F7"/>
      <stop offset="45%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#4C1D95"/>
    </linearGradient>

    <!-- Top Highlight Gloss Gradient -->
    <linearGradient id="glossGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.05"/>
    </linearGradient>

    <!-- D-Pad Gradient -->
    <linearGradient id="dpadGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#0E7490"/>
    </linearGradient>

    <!-- Action Buttons Gradients -->
    <linearGradient id="btnYellow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#EAB308"/>
    </linearGradient>

    <linearGradient id="btnRed" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F43F5E"/>
      <stop offset="100%" stop-color="#BE123C"/>
    </linearGradient>

    <linearGradient id="btnGreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4ADE80"/>
      <stop offset="100%" stop-color="#16A34A"/>
    </linearGradient>

    <linearGradient id="btnBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <!-- Thumbstick Gradients -->
    <linearGradient id="stickBase" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#374151"/>
      <stop offset="100%" stop-color="#1F2937"/>
    </linearGradient>
    <linearGradient id="stickCap" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#C2410C"/>
    </linearGradient>

    <filter id="softShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="12" flood-color="#000000" flood-opacity="0.3"/>
    </filter>

    <filter id="btnShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="4" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Fun Playful Sparkles & Stars in Background -->
  <!-- Top Right Sparkle -->
  <path d="M430 80 Q430 115 465 115 Q430 115 430 150 Q430 115 395 115 Q430 115 430 80 Z" fill="#FBBF24" />
  <circle cx="430" cy="115" r="7" fill="#FFFFFF"/>
  <circle cx="475" cy="70" r="8" fill="#F43F5E"/>
  
  <!-- Top Left Sparkle -->
  <path d="M85 95 Q85 120 110 120 Q85 120 85 145 Q85 120 60 120 Q85 120 85 95 Z" fill="#38BDF8" />
  <circle cx="50" cy="85" r="9" fill="#FDE047"/>
  <circle cx="120" cy="70" r="6" fill="#A855F7"/>

  <!-- Bottom Stars -->
  <circle cx="70" cy="400" r="10" fill="#4ADE80"/>
  <circle cx="445" cy="390" r="11" fill="#F97316"/>

  <!-- GAMEPAD MAIN BODY (Chunky Cartoon Curves) -->
  <g filter="url(#softShadow)">
    <!-- Outer Border / Shadow rim -->
    <path d="M150 140 C210 160 302 160 362 140 C430 120 480 170 475 290 C472 380 410 435 345 425 C305 418 280 375 256 375 C232 375 207 418 167 425 C102 435 40 380 37 290 C32 170 82 120 150 140 Z" 
          fill="#3B0764" />

    <!-- Main Vibrant Body -->
    <path d="M152 146 C210 165 302 165 360 146 C424 128 468 174 463 286 C460 370 402 422 342 413 C304 406 280 368 256 368 C232 368 208 406 170 413 C110 422 52 370 49 286 C44 174 88 128 152 146 Z" 
          fill="url(#bodyGrad)" 
          stroke="#C084FC" 
          stroke-width="7" />

    <!-- Upper Gloss/Specular Bubble Highlight -->
    <path d="M156 156 C210 172 302 172 356 156 C406 142 440 176 444 235 C420 200 370 190 320 188 C276 186 236 186 192 188 C142 190 92 200 68 235 C72 176 106 142 156 156 Z" 
          fill="url(#glossGrad)" />
  </g>

  <!-- Cute Grip Dots (Left & Right) -->
  <circle cx="85" cy="330" r="5" fill="#D8B4FE" opacity="0.6"/>
  <circle cx="75" cy="348" r="5" fill="#D8B4FE" opacity="0.6"/>
  <circle cx="95" cy="348" r="5" fill="#D8B4FE" opacity="0.6"/>

  <circle cx="427" cy="330" r="5" fill="#D8B4FE" opacity="0.6"/>
  <circle cx="417" cy="348" r="5" fill="#D8B4FE" opacity="0.6"/>
  <circle cx="437" cy="348" r="5" fill="#D8B4FE" opacity="0.6"/>

  <!-- D-PAD (DIRECTIONAL CROSS - LEFT SIDE) -->
  <g filter="url(#btnShadow)">
    <!-- Base plate -->
    <rect x="100" y="222" width="76" height="26" rx="8" fill="#1E1B4B" />
    <rect x="125" y="197" width="26" height="76" rx="8" fill="#1E1B4B" />

    <!-- Top D-pad Buttons with vibrant cyan/blue -->
    <rect x="102" y="224" width="72" height="22" rx="7" fill="url(#dpadGrad)" stroke="#67E8F9" stroke-width="2" />
    <rect x="127" y="199" width="22" height="72" rx="7" fill="url(#dpadGrad)" stroke="#67E8F9" stroke-width="2" />
    <circle cx="138" cy="235" r="6" fill="#0891B2" />

    <!-- Direction Triangle Arrows -->
    <path d="M138 205 L133 214 L143 214 Z" fill="#FFFFFF"/>
    <path d="M138 265 L133 256 L143 256 Z" fill="#FFFFFF"/>
    <path d="M108 235 L117 230 L117 240 Z" fill="#FFFFFF"/>
    <path d="M168 235 L159 230 L159 240 Z" fill="#FFFFFF"/>
  </g>

  <!-- CANDY ACTION BUTTONS (4 PLAYFUL COLORFUL CIRCLES - RIGHT SIDE) -->
  <!-- Top Button: Sunny Yellow (Star / Y) -->
  <g filter="url(#btnShadow)">
    <circle cx="374" cy="195" r="19" fill="#713F12" />
    <circle cx="374" cy="193" r="17" fill="url(#btnYellow)" stroke="#FEF08A" stroke-width="2.5" />
    <ellipse cx="371" cy="187" rx="9" ry="5" fill="#FFFFFF" opacity="0.6" />
    <!-- Mini star inside -->
    <path d="M374 186 L376 191 L381 192 L377 195 L378 200 L374 197 L370 200 L371 195 L367 192 L372 191 Z" fill="#A16207" />
  </g>

  <!-- Right Button: Energetic Red (B) -->
  <g filter="url(#btnShadow)">
    <circle cx="414" cy="235" r="19" fill="#881337" />
    <circle cx="414" cy="233" r="17" fill="url(#btnRed)" stroke="#FDA4AF" stroke-width="2.5" />
    <ellipse cx="411" cy="227" rx="9" ry="5" fill="#FFFFFF" opacity="0.6" />
    <!-- Heart or B inside -->
    <circle cx="414" cy="233" r="6" fill="#9F1239" />
    <circle cx="414" cy="233" r="3" fill="#FFFFFF" />
  </g>

  <!-- Bottom Button: Lime Green (A) -->
  <g filter="url(#btnShadow)">
    <circle cx="374" cy="275" r="19" fill="#14532D" />
    <circle cx="374" cy="273" r="17" fill="url(#btnGreen)" stroke="#BBF7D0" stroke-width="2.5" />
    <ellipse cx="371" cy="267" rx="9" ry="5" fill="#FFFFFF" opacity="0.6" />
    <circle cx="374" cy="273" r="6" fill="#15803D" />
    <circle cx="374" cy="273" r="3" fill="#FFFFFF" />
  </g>

  <!-- Left Button: Sky Blue (X) -->
  <g filter="url(#btnShadow)">
    <circle cx="334" cy="235" r="19" fill="#0C4A6E" />
    <circle cx="334" cy="233" r="17" fill="url(#btnBlue)" stroke="#BAE6FD" stroke-width="2.5" />
    <ellipse cx="331" cy="227" rx="9" ry="5" fill="#FFFFFF" opacity="0.6" />
    <circle cx="334" cy="233" r="6" fill="#0369A1" />
    <circle cx="334" cy="233" r="3" fill="#FFFFFF" />
  </g>

  <!-- CENTER THUMBSTICKS (JOYSTICKS) -->
  <!-- Left Thumbstick -->
  <g filter="url(#btnShadow)">
    <circle cx="186" cy="308" r="32" fill="#111827" stroke="#374151" stroke-width="3" />
    <circle cx="186" cy="305" r="26" fill="url(#stickCap)" stroke="#FDBA74" stroke-width="3" />
    <ellipse cx="182" cy="296" rx="14" ry="7" fill="#FFFFFF" opacity="0.45" />
    <circle cx="186" cy="305" r="10" fill="#9A3412" />
    <circle cx="186" cy="305" r="4" fill="#FED7AA" />
  </g>

  <!-- Right Thumbstick -->
  <g filter="url(#btnShadow)">
    <circle cx="326" cy="308" r="32" fill="#111827" stroke="#374151" stroke-width="3" />
    <circle cx="326" cy="305" r="26" fill="url(#stickCap)" stroke="#FDBA74" stroke-width="3" />
    <ellipse cx="322" cy="296" rx="14" ry="7" fill="#FFFFFF" opacity="0.45" />
    <circle cx="326" cy="305" r="10" fill="#9A3412" />
    <circle cx="326" cy="305" r="4" fill="#FED7AA" />
  </g>

  <!-- CENTER BUTTONS (PLUS / MINUS / HOME) -->
  <!-- Select / Pause Pill Buttons -->
  <rect x="220" y="215" width="22" height="10" rx="5" fill="#FDE047" stroke="#854D0E" stroke-width="2" />
  <rect x="270" y="215" width="22" height="10" rx="5" fill="#FDE047" stroke="#854D0E" stroke-width="2" />

  <!-- Center Home / Nickel Burger Icon Button -->
  <g filter="url(#btnShadow)">
    <circle cx="256" cy="254" r="19" fill="#F59E0B" stroke="#FFFFFF" stroke-width="3" />
    <circle cx="256" cy="254" r="15" fill="#EF4444" />
    <!-- Cute mini dog paw / burger smile -->
    <circle cx="251" cy="251" r="2.5" fill="#FFFFFF" />
    <circle cx="261" cy="251" r="2.5" fill="#FFFFFF" />
    <path d="M250 258 Q256 264 262 258" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" fill="none" />
  </g>

  <!-- Bumper & Trigger Lights on Top Corners -->
  <rect x="110" y="115" width="46" height="14" rx="7" fill="#F43F5E" stroke="#881337" stroke-width="2" transform="rotate(-14 133 122)"/>
  <rect x="356" y="115" width="46" height="14" rx="7" fill="#38BDF8" stroke="#0369A1" stroke-width="2" transform="rotate(14 379 122)"/>
</svg>
